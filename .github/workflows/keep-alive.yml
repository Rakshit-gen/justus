name: Keep Render Warm

# Pings /api/ping on a schedule so the Render free-tier instance doesn't
# sleep after 15 minutes of inactivity. This is a backup for UptimeRobot —
# either alone is enough; running both gives redundancy.
#
# Set the repo secret KEEP_ALIVE_URL to your Render URL, e.g.
#   https://chatme-xyz.onrender.com/api/ping
# (Repo → Settings → Secrets and variables → Actions → New repository secret)

on:
  schedule:
    # Every 10 minutes. GitHub may delay scheduled runs during high load —
    # that's fine, UptimeRobot is the primary keep-alive.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping
        env:
          URL: ${{ secrets.KEEP_ALIVE_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::KEEP_ALIVE_URL secret is not set"
            exit 1
          fi
          echo "Pinging $URL"
          # -f fails on 4xx/5xx, --max-time caps Render's cold-start wait
          curl -fsS --max-time 90 --retry 2 --retry-delay 5 "$URL"
          echo
          echo "OK"
